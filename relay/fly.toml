# Fly.io config for the gather relay. Rename the app to something unique, then: fly launch --copy-config --no-deploy,
# fly secrets set RELAY_SECRET=…, fly deploy. The machine stops when nobody is live and starts on the next stream.
app = "gather-relay"
primary_region = "iad"

[build]

[env]
  RELAY_MAX_STREAMS = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
